# Fast SB3 Training Configuration
# Uses Stable Baselines3 SAC for faster training

environment:
  name: salp_snake
  type: salp_snake
  width: 640  # Standard size
  height: 480
  params:
    num_food_items: 1
    food_reward: 10.0
    collision_penalty: -5.0
    time_penalty: -0.01
    efficiency_bonus: 0.0
    forced_breathing: true
    respawn_food: true
    max_steps_without_food: 2000

agent:
  name: sac_salp
  type: sac
  hidden_sizes: [256, 256]
  activation: relu
  learning_rate: 0.0003
  batch_size: 128
  buffer_size: 100000
  gamma: 0.99
  tau: 0.005
  params:
    alpha: 0.1
    target_entropy: -1.0
    alpha_lr: 0.0003

training:
  max_episodes: 50
  max_steps_per_episode: 1000
  eval_frequency: 10
  save_frequency: 25
  start_training_after: 500
  train_frequency: 1
  target_update_frequency: 1
  log_dir: data/logs
  model_dir: data/models
  experiment_name: salp_sb3_fast

gail:
  use_gail: false
